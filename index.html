<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f6f8">
<title>VO PILOT</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{height:80px;background:#fff;border-bottom:1px solid #dfe3e8;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800}
main{max-width:1500px;margin:auto;padding:26px 28px 60px}.date{color:#687386;margin-bottom:22px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.module{border:1px solid #dfe3e8;background:#fff;border-radius:20px;min-height:135px;padding:24px;text-align:left;box-shadow:0 2px 8px #0000000d;cursor:pointer}.module-head{display:flex;gap:10px;align-items:center;font-size:20px}.module-count{font-size:36px;font-weight:800;margin-top:14px}
.contacts{width:100%;margin-top:16px;min-height:90px;text-align:center;font-weight:700}
.action{width:100%;margin:34px 0 42px;background:#111827;color:white;border:0;border-radius:16px;padding:19px;font-size:18px;font-weight:700;cursor:pointer}
.section-title{font-size:14px;font-weight:800;color:#687386;text-transform:uppercase;margin-bottom:12px}.empty{color:#687386;margin-bottom:20px}.show-all{width:100%;border:0;background:#eceff3;border-radius:16px;padding:18px;font-size:17px;font-weight:700;margin-bottom:44px;cursor:pointer}
.list{display:grid;gap:10px}.item{background:white;border:1px solid #dfe3e8;border-radius:14px;padding:16px;display:flex;justify-content:space-between;gap:12px}.item-title{font-weight:700}.item-sub{color:#687386;font-size:14px;margin-top:4px}
.small{border:1px solid #dfe3e8;background:white;border-radius:10px;padding:8px 11px;cursor:pointer}.danger{color:#b42318}
.back{background:white;border:1px solid #dfe3e8;border-radius:11px;padding:9px 13px;margin-bottom:18px;cursor:pointer}.title{font-size:30px;margin:0 0 20px}
.modal-bg{position:fixed;inset:0;background:#0f172a7a;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal-bg.open{display:flex}.modal{position:relative;background:white;border-radius:22px;padding:26px;width:min(650px,100%);max-height:90vh;overflow:auto}.modal h2{margin:0 45px 22px 0}.close{position:absolute;right:14px;top:12px;border:0;background:transparent;font-size:34px;color:#596273;cursor:pointer;width:42px;height:42px}.form{display:grid;gap:14px}.field{display:grid;gap:7px}.field label{font-size:14px;font-weight:650}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #cfd5dd;border-radius:11px;font:inherit}.form-actions{display:flex;justify-content:flex-end;margin-top:8px}.save{border:0;background:#111827;color:white;border-radius:11px;padding:11px 18px;font-weight:700;cursor:pointer}
@media(max-width:850px){main{padding:20px 14px}.cards{grid-template-columns:1fr 1fr}.module{min-height:140px;padding:19px}}
@media(max-width:520px){header{height:70px;font-size:25px}.cards{gap:12px}.module{padding:18px}.module-head{font-size:18px}.module-count{font-size:34px}}
</style>
</head>
<body>
<header>VO PILOT</header>
<main id="app"></main>
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalBox"></div></div>
<script>
const K="vo_pilot";let db=JSON.parse(localStorage.getItem(K)||'{"vehicles":[],"contacts":[],"sales":[],"deliveries":[],"tasks":[],"events":[]}');
const save=()=>localStorage.setItem(K,JSON.stringify(db)),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function closeModal(){modal.classList.remove("open");modalBox.innerHTML=""}
function openModal(x){modalBox.innerHTML=x;modal.classList.add("open")}
function home(){let a=db.vehicles.filter(x=>x.status=="arrivee").length,p=db.vehicles.filter(x=>x.status=="parc").length,s=db.sales.length,d=db.deliveries.filter(x=>x.status=="active").length,t=db.tasks.filter(x=>!x.done);app.innerHTML=`<div class=date>${new Intl.DateTimeFormat("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date())}</div><div class=cards>${M("🚚","Arrivages",a,"arrivals")}${M("🚘","Parc",p,"park")}${M("💰","Ventes",s,"sales")}${M("🚗","Livraisons",d,"deliveries")}</div><button class="module contacts" onclick="contacts()">👤 Contacts</button><button class=action onclick="newTask()">＋ Ajouter une tâche</button><div class=section-title>À faire</div>${t.length?`<div class=list>${t.slice(0,5).map(task).join("")}</div>`:`<div class=empty>Aucune tâche en attente 🎉</div>`}<button class=show-all onclick="allTasks()">▼ Afficher toutes les tâches</button><div class=section-title>Événements d'aujourd'hui</div><div class=empty>${eventsToday()}</div>`}
function M(i,n,c,f){return `<button class=module onclick="${f}()"><div class=module-head><span>${i}</span><span>${n}</span></div><div class=module-count>${c}</div></button>`}
function task(t){return `<div class=item><div><div class=item-title>${esc(t.title)}</div><div class=item-sub>Échéance : ${esc(t.due||"—")}</div></div><div><button class=small onclick="done('${t.id}')">✓</button> <button class="small danger" onclick="delTask('${t.id}')">🗑</button></div></div>`}
function eventsToday(){let d=new Date().toISOString().slice(0,10),e=db.events.filter(x=>x.date==d);return e.length?e.map(x=>esc(x.title)+" "+esc(x.time||"")).join(" · "):"Aucun événement aujourd’hui."}
function back(){return `<button class=back onclick=home()>← Retour</button>`}
function listPage(title,arr,add,empty){app.innerHTML=`${back()}<h1 class=title>${title}</h1>${add?`<button class=action onclick="${add}()">＋ Ajouter</button>`:""}<div class=list>${arr||`<div class=empty>${empty}</div>`}</div>`}
function arrivals(){listPage("🚚 Arrivages",db.vehicles.filter(x=>x.status=="arrivee").map(vehicle).join(""),"newArrival","Aucun arrivage.")}
function park(){listPage("🚘 Parc",db.vehicles.filter(x=>x.status=="parc").map(vehicle).join(""),null,"Aucun véhicule dans le parc.")}
function vehicle(v){return `<div class=item><div><div class=item-title>${esc(v.model)}</div><div class=item-sub>${esc(v.immat||"Sans immatriculation")} · ${esc(v.finish||"")}</div></div><button class=small onclick="showVehicle('${v.id}')">Ouvrir</button></div>`}
function showVehicle(i){let v=db.vehicles.find(x=>x.id==i);openModal(`<button class=close onclick=closeModal()>×</button><h2>🚘 ${esc(v.model)}</h2><p>Statut : <b>${esc(v.status)}</b></p><p>Immatriculation : ${esc(v.immat||"—")}</p><p>Finition : ${esc(v.finish||"—")}</p><p>Kilométrage : ${esc(v.km||"—")}</p>`)}
function sales(){listPage("💰 Ventes",db.sales.map(x=>`<div class=item><div><div class=item-title>${esc(x.clientName)}</div><div class=item-sub>${esc(x.vehicleName||"")}</div></div><button class="small danger" onclick="delSale('${x.id}')">🗑</button></div>`).join(""),"newSale","Aucune vente.")}
function deliveries(){listPage("🚗 Livraisons",db.deliveries.map(x=>`<div class=item><div><div class=item-title>${esc(x.clientName)}</div><div class=item-sub>${esc(x.vehicleName||"")} · ${esc(x.date||"")}</div></div></div>`).join(""),null,"Aucune livraison.")}
function contacts(){listPage("👤 Contacts",db.contacts.map(x=>`<div class=item><div><div class=item-title>${esc(x.name)}</div><div class=item-sub>${esc(x.phone||"")} ${esc(x.email||"")}</div></div><button class="small danger" onclick="delContact('${x.id}')">🗑</button></div>`).join(""),"newContact","Aucun contact.")}
function allTasks(){listPage("☑ Toutes les tâches",db.tasks.map(task).join(""),"newTask","Aucune tâche.")}
function form(title,fields,fn){openModal(`<button class=close onclick=closeModal()>×</button><h2>${title}</h2><form class=form onsubmit="${fn}(this);return false">${fields}<div class=form-actions><button class=save>Enregistrer</button></div></form>`)}
function F(l,n,t="text",r=""){return `<div class=field><label>${l}</label><input name="${n}" type="${t}" ${r}></div>`}
function newTask(){form("☑ Nouvelle tâche",F("Titre *","title","text","required")+F("Échéance","due","date")+F("Importance","priority"),"submitTask")}
function submitTask(f){db.tasks.push({id:id(),done:false,...Object.fromEntries(new FormData(f))});save();closeModal();home()}
function done(i){let x=db.tasks.find(x=>x.id==i);if(x)x.done=!x.done;save();home()}function delTask(i){db.tasks=db.tasks.filter(x=>x.id!=i);save();home()}
function newArrival(){form("🚚 Nouvel arrivage",F("Modèle *","model","text","required")+F("Immatriculation","immat")+F("Finition","finish")+F("Kilométrage","km","number")+F("Couleur","color")+F("Prix d'achat","buyPrice","number"),"submitArrival")}
function submitArrival(f){db.vehicles.push({id:id(),status:"arrivee",...Object.fromEntries(new FormData(f))});save();closeModal();arrivals()}
function newContact(){form("👤 Nouveau contact",F("Nom *","name","text","required")+F("Téléphone","phone","tel")+F("E-mail","email","email")+F("Notes","notes"),"submitContact")}
function submitContact(f){db.contacts.push({id:id(),...Object.fromEntries(new FormData(f))});save();closeModal();contacts()}function delContact(i){db.contacts=db.contacts.filter(x=>x.id!=i);save();contacts()}
function newSale(){form("💰 Nouvelle vente",F("Client *","clientName","text","required")+F("Véhicule","vehicleName")+F("Date","date","date")+F("Prix","price","number"),"submitSale")}
function submitSale(f){db.sales.push({id:id(),status:"active",...Object.fromEntries(new FormData(f))});save();closeModal();sales()}function delSale(i){db.sales=db.sales.filter(x=>x.id!=i);save();sales()}
home();
</script>
</body>
</html>
