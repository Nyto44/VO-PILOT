<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><meta name="app-version" content="v0.3-ui-fix"><title>VO Pilot</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:900px;margin:auto;padding-bottom:80px}header{position:sticky;top:0;background:#f5f6f8ee;backdrop-filter:blur(10px);padding:14px 16px;border-bottom:1px solid #ddd;z-index:5}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:20px}.ib{border:1px solid #ddd;background:white;border-radius:12px;width:42px;height:42px;font-size:20px}main{padding:18px 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card,.row,.box,.task,.event{background:#fff;border:1px solid #e2e5e9;border-radius:16px;padding:14px;box-shadow:0 3px 12px #00000009}.module{text-align:left;position:relative;min-height:115px;display:flex;flex-direction:column;justify-content:space-between;width:100%;color:#111827;text-decoration:none;appearance:none}.module b{font-size:15px;font-weight:600}.module strong{display:block;font-size:30px;margin-top:10px}.moduleIcon{font-size:24px;margin-right:7px}.moduleTitle{display:flex;align-items:center;gap:4px;font-size:17px}.module:hover{border-color:#cbd5e1;transform:translateY(-1px)}.badge{position:absolute;right:10px;top:10px;background:#ef4444;color:#fff;border-radius:99px;padding:4px 8px;font-size:12px}.add{width:100%;background:#111827;color:#fff;border:0;border-radius:12px;padding:13px;font-weight:700;margin:14px 0}.muted{color:#6b7280;font-size:13px}.section{font-size:13px;font-weight:800;text-transform:uppercase;color:#6b7280;margin:22px 0 8px}.row{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;margin:8px 0}.status{white-space:nowrap;font-size:12px;font-weight:800;border-radius:99px;padding:6px 8px;background:#dcfce7;color:#166534;height:max-content}.bad{background:#fee2e2;color:#991b1b}.back{border:0;background:none;font-size:28px}.title{display:flex;align-items:center;gap:8px}.title h1{margin:0}.search{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;background:white;margin:10px 0}.fab{position:fixed;right:20px;bottom:20px;background:#111827;color:white;border:0;border-radius:18px;width:56px;height:56px;font-size:28px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.primary,.secondary,.danger{border:0;border-radius:10px;padding:11px 14px;font-weight:700}.primary{background:#111827;color:white}.secondary{background:#eef0f3}.danger{background:#fee2e2;color:#991b1b}.check{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #eee}.check input{width:20px;height:20px}.box{margin:12px 0}.box h3{margin:0 0 8px}.field{margin:11px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;background:#fff}.tw{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modalbg{position:fixed;inset:0;background:#0006;z-index:20;display:flex;align-items:flex-end}.modal{background:white;width:100%;max-width:650px;margin:auto;border-radius:20px 20px 0 0;padding:18px;max-height:92vh;overflow:auto}.modalhead{display:flex;justify-content:flex-end;margin:-4px -4px 10px}.modalclose{border:0;background:#eef0f3;border-radius:10px;padding:9px 13px;font-weight:700;color:#111827}.modalclose:hover{background:#e5e7eb}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cell{background:white;border:1px solid #ddd;border-radius:8px;min-height:65px;padding:5px;font-size:11px}.cell b{font-size:13px}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:11px;z-index:30}@media(min-width:700px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}.modalbg{align-items:center}.modal{border-radius:18px}}
</style></head><body><div id="app"></div>
<script>
const K='vopilot_v1';let db=JSON.parse(localStorage.getItem(K)||'null')||{vehicles:[],contacts:[],sales:[],deliveries:[],tasks:[],events:[]};let screen='home',search='',cal=new Date();
const id=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random();const save=()=>localStorage.setItem(K,JSON.stringify(db));const today=()=>new Date().toISOString().slice(0,10);const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const fmt=s=>s?new Date(s+'T12:00').toLocaleDateString('fr-FR'):'';const V=()=>db.vehicles.filter(v=>v.status==='parc'),A=()=>db.vehicles.filter(v=>v.status==='arrivage'),S=()=>db.sales.filter(v=>v.status==='active'),D=()=>db.deliveries.filter(v=>v.status==='active');function go(x){screen=x;search='';render()}function openModal(x){document.body.insertAdjacentHTML('beforeend',x);const m=document.querySelector('.modalbg:last-child .modal');if(m&&!m.querySelector('.modalclose'))m.insertAdjacentHTML('afterbegin','<div class=modalhead><button type=button class=modalclose onclick=close()>Annuler</button></div>');bind()}function close(){document.querySelector('.modalbg')?.remove()}function task(title,opt={}){db.tasks.push({id:id(),title,done:false,due:opt.due||'',priority:opt.priority||'Normale',type:opt.type||'',ref:opt.ref||''});save()}function linked(type,ref,title){if(!db.tasks.some(t=>!t.done&&t.type===type&&t.ref===ref&&t.title===title))task(title,{type,ref})}function done(type,ref){db.tasks.filter(t=>!t.done&&t.type===type&&t.ref===ref).forEach(t=>t.done=true);save()}
function header(back=true){return `<header><div class=top>${back?'<button class=ib onclick="go(\'home\')">‹</button>':'<button class=ib onclick="go(\'calendar\')">📅</button>'}<div class=brand>VO PILOT</div><div style="width:42px"></div></div></header>`}
function home(){let a=A(),p=V(),s=S(),d=D(),c=db.contacts,ts=db.tasks.filter(t=>!t.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')),ev=db.events.filter(e=>e.date===today());return header(false)+`<main><div class=muted>${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><div class=grid style="margin-top:14px">${mod('🚚','Arrivages',a.length,a.filter(v=>!v.delivered||!v.prep||!v.caro||v.pvo).length,'arrivals')}${mod('🚘','Parc',p.length,p.filter(v=>!v.affiche||!v.cache||!v.garantie||(v.problems||[]).some(x=>!x.done)).length,'parc')}${mod('💰','Ventes',s.length,s.filter(x=>missingSale(x)).length,'sales')}${mod('🚗','Livraisons',d.length,d.filter(x=>missingDel(x)).length,'deliveries')}${mod('👤','Contacts',c.length,c.filter(x=>db.tasks.some(t=>!t.done&&t.type==='contact'&&t.ref===x.id)).length,'contacts')}</div><button class=add onclick="newTask()">＋ Ajouter une tâche</button><div class=section>À faire</div>${ts.length?ts.map(t=>`<div class=task style="display:flex;justify-content:space-between;gap:10px"><div><b>🔴 ${esc(t.title)}</b><div class=muted>${t.due?'Échéance '+fmt(t.due):'Sans échéance'} · ${t.priority}</div></div><button class=secondary onclick="finishTask('${t.id}')">✓</button></div>`).join(''):'<div class=muted>Aucune tâche en attente 🎉</div>'}<button class=add style="background:#eef0f3;color:#111" onclick="showAllTasks()">▼ Afficher toutes les tâches</button><div class=section>Événements d'aujourd'hui</div>${ev.length?ev.map(e=>`<div class=event>📅 <b>${esc(e.start||'')} ${esc(e.title)}</b></div>`).join(''):'<div class=muted>Aucun événement aujourd’hui.</div>'}</main>`}
function mod(i,l,n,b,nav){return `<button type="button" class="card module" onclick="go('${nav}')"><span class="moduleTitle"><span class="moduleIcon">${i}</span>${l}</span><strong>${n}</strong>${b?`<span class=badge>${b}</span>`:''}</button>`}
function listScreen(type){let arr=type==='arrivals'?A():type==='parc'?V():type==='sales'?S():D();let title={arrivals:'Arrivages',parc:'Parc',sales:'Ventes',deliveries:'Livraisons'}[type];arr=arr.filter(x=>JSON.stringify(x).toLowerCase().includes(search.toLowerCase())).sort((a,b)=>(a.model||a.vehicleName||a.clientName||'').localeCompare(b.model||b.vehicleName||b.clientName||''));return header()+`<main><div class=title><h1>${title}</h1>${type!=='deliveries'?`<button class=ib style="margin-left:auto" onclick="new${type==='arrivals'?'Arrival':type==='parc'?'Parc': 'Sale'}()">＋</button>`:''}</div><input class=search placeholder="Rechercher…" value="${esc(search)}" oninput="search=this.value;render()"><div class=muted>${arr.length} élément(s)</div>${arr.map(x=>row(type,x)).join('')||'<div class=muted style="padding:20px">Rien à afficher.</div>'}</main>`}
function row(t,x){if(t==='arrivals'||t==='parc'){let n=t==='arrivals'?[!x.delivered,!x.prep,!x.caro,x.pvo].filter(Boolean).length:[!x.affiche,!x.cache,!x.garantie,(x.problems||[]).some(p=>!p.done)].filter(Boolean).length;return `<button class=row onclick="vehicle('${x.id}')"><div><b>🚘 ${esc(x.model)}</b><div class=muted>${x.vo?'VO '+esc(x.vo)+' · ':''}${esc(x.immat||'')}</div></div><span class="status ${n?'bad':''}">${n?'🔴 '+n+' à traiter':'✓ OK'}</span></button>`}if(t==='sales'){let n=missingSale(x);return `<button class=row onclick="sale('${x.id}')"><div><b>💰 ${esc(x.clientName||'Vente')}</b><div class=muted>🚘 ${esc(x.vehicleName)} · ${x.deliveryDate?'📅 '+fmt(x.deliveryDate):'Date non définie'}</div></div><span class="status ${n?'bad':''}">${n?'🔴 '+n+' manquant(s)':'🟢 Complet'}</span></button>`}let n=missingDel(x);return `<button class=row onclick="delivery('${x.id}')"><div><b>🚘 ${esc(x.vehicleName)}</b><div class=muted>${esc(x.clientName||'')} · 📅 ${fmt(x.date)}</div></div><span class="status ${n?'bad':''}">${n?'🔴 '+n+' à faire':'🟢 Prête'}</span></button>`}
function vehicle(idv){let v=db.vehicles.find(x=>x.id===idv),a=v.status==='arrivage';openModal(`<div class=modalbg onclick="close()"><div class=modal onclick="event.stopPropagation()"><h2>🚘 ${esc(v.model)}</h2><div class=box><b>Informations</b><div class=muted>${v.finish||''} · ${v.vo?'VO '+v.vo:'N° VO non renseigné'} · ${v.immat||''}</div><div class=muted>${v.km||''} km · ${v.color||''}</div><div class=muted>Prix bleu ${v.bluePrice||'—'} € · Prix noir ${v.blackPrice||'—'} €</div><div class=muted>Achat ${fmt(v.buyDate)||'—'} · ${v.buyPrice||'—'} €</div></div>${a?arrivalChecks(v):parcChecks(v)}</div></div>`)}
function arrivalChecks(v){return `<div class=box><h3>État</h3>${[['delivered','Livré'],['prep','Préparation esthétique'],['caro','Carrosserie'],['pvo','PVO — À faire']].map(([k,l])=>`<label class=check><input type=checkbox ${v[k]?'checked':''} onchange="vcheck('${v.id}','${k}',this.checked)"><span>${l}</span>${k==='pvo'&&!v.pvo?'<span class="status bad" style="margin-left:auto">À faire</span>':''}</label>`).join('')}<div class=actions><button class=primary onclick="finishArrival('${v.id}')">Terminer l'arrivage</button><button class=danger onclick="cancelArrival('${v.id}')">Annuler</button></div></div>`}
function parcChecks(v){return `<div class=box><h3>Contrôle Parc</h3>${[['affiche','Affiche'],['cache','Cache-plaque'],['garantie','Garantie']].map(([k,l])=>`<label class=check><input type=checkbox ${v[k]?'checked':''} onchange="vcheck('${v.id}','${k}',this.checked)"><span>${l}</span></label>`).join('')}<div class=actions><button class=secondary onclick="report('${v.id}')">⚠️ Signaler un problème</button><button class=primary onclick="sell('${v.id}')">💰 Vendre ce véhicule</button></div></div><div class=box><h3>Problèmes</h3>${(v.problems||[]).map(p=>`<label class=check><input type=checkbox ${p.done?'checked':''} onchange="problem('${v.id}','${p.id}',this.checked)"><span>${esc(p.title)}</span></label>`).join('')||'<div class=muted>Aucun problème.</div>'}</div>`}
function missingSale(s){let n=0;for(const g of Object.values(s.checks))for(const v of Object.values(g))if(!v)n++;return n}
function sale(idv){let s=db.sales.find(x=>x.id===idv);let groups=[['Dossier',['BDC BACS','BDC DBS','Documents','Forfait signé','Date de livraison','OR','GSTAT','Tableau perso'],s.checks.dossier]];if(s.reprise)groups.push(['Reprise',['Estimation Alcopa','Estimation de reprise signée','Carte grise','Histovec'],s.checks.reprise]);if(s.finance)groups.push(['Financement',['Contrat signé','Documents transmis'],s.checks.finance]);if(s.service)groups.push(["Contrat d'entretien",['Contrat signé'],s.checks.service]);openModal(`<div class=modalbg onclick=close()><div class=modal onclick="event.stopPropagation()"><h2>💰 Vente</h2><div class=box><b>${esc(s.clientName||'Client')}</b><div class=muted>🚘 ${esc(s.vehicleName)} ${s.vo?'· VO '+s.vo:''}</div><div class=muted>📅 ${s.deliveryDate?fmt(s.deliveryDate):'non définie'} ${s.start?'· '+s.start:''}</div></div>${groups.map(g=>`<div class=box><h3>${g[0]}</h3>${Object.keys(g[2]).map((k,i)=>`<label class=check><input type=checkbox ${g[2][k]?'checked':''} onchange="salecheck('${s.id}','${g[0]}','${k}',this.checked)"><span>${g[1][i]}</span>${!g[2][k]?'<span class="status bad" style="margin-left:auto">Manquant</span>':''}</label>`).join('')}</div>`).join('')}<div class=actions><button class=secondary onclick="saleEvent('${s.id}')">📅 Livraison</button><button class=primary onclick="openDelivery('${s.id}')">🚗 Ouvrir livraison</button></div></div></div>`)}
function missingDel(d){return [!d.fuel,!d.gravage].filter(Boolean).length+(d.others||[]).filter(x=>!x.done).length}
function delivery(idv){let d=db.deliveries.find(x=>x.id===idv);openModal(`<div class=modalbg onclick=close()><div class=modal onclick="event.stopPropagation()"><h2>🚗 Livraison</h2><div class=box><b>🚘 ${esc(d.vehicleName)}</b><div class=muted>${esc(d.clientName||'')} · 📅 ${fmt(d.date)} ${d.start?'· '+d.start:''}${d.end?' → '+d.end:''}</div></div><div class=box><h3>À faire</h3>${[['fuel','Carburant'],['gravage','Gravage']].map(([k,l])=>`<label class=check><input type=checkbox ${d[k]?'checked':''} onchange="dcheck('${d.id}','${k}',this.checked)"><span>${l}</span></label>`).join('')}${(d.others||[]).map(o=>`<label class=check><input type=checkbox ${o.done?'checked':''} onchange="othercheck('${d.id}','${o.id}',this.checked)"><span>${esc(o.title)}</span></label>`).join('')}<button class=secondary onclick="other('${d.id}')">＋ Autre</button></div><div class=box><h3>Prérequis</h3>${[['revision','Révision'],['bsh','BSH'],['ct','CT'],['pts160','160 PTS'],['battery','Test batterie'],['prepEst','Préparation esthétique']].map(([k,l])=>`<label class=check><input type=checkbox ${d.pre[k]?'checked':''} onchange="pre('${d.id}','${k}',this.checked)"><span>${l}</span></label>`).join('')}</div><button class=primary onclick="finishDelivery('${d.id}')">✓ Terminer la livraison</button></div></div>`)}
function contacts(){let cs=db.contacts.filter(c=>JSON.stringify(c).toLowerCase().includes(search.toLowerCase()));return header()+`<main><div class=title><h1>Contacts</h1><button class=ib style="margin-left:auto" onclick="newContact()">＋</button></div><input class=search placeholder="Rechercher…" value="${esc(search)}" oninput="search=this.value;render()">${cs.map(c=>`<button class=row onclick="contact('${c.id}')"><div><b>👤 ${esc(c.first)} ${esc(c.last)}</b><div class=muted>${esc((c.source||[]).join(', '))}</div></div><span class=status>${db.tasks.filter(t=>!t.done&&t.type==='contact'&&t.ref===c.id).length||'Aucun'} ${db.tasks.some(t=>!t.done&&t.type==='contact'&&t.ref===c.id)?'rappel':''}</span></button>`).join('')||'<div class=muted>Aucun contact.</div>'}</main>`}
function contact(idc){let c=db.contacts.find(x=>x.id===idc),vs=(c.vehicleIds||[]).map(x=>db.vehicles.find(v=>v.id===x)).filter(Boolean),ts=db.tasks.filter(t=>!t.done&&t.type==='contact'&&t.ref===idc);openModal(`<div class=modalbg onclick=close()><div class=modal onclick="event.stopPropagation()"><h2>👤 ${esc(c.first)} ${esc(c.last)}</h2><div class=box><div class=muted>${esc((c.source||[]).join(', '))}</div><p>${esc(c.note||'')}</p></div><div class=box><h3>🚘 Véhicules d'intérêt</h3>${vs.map(v=>`<div>${esc(v.model)} ${v.vo?'· VO '+v.vo:''}</div>`).join('')||'<div class=muted>Aucun</div>'}</div><div class=box><h3>🔔 Rappels</h3>${ts.map(t=>`<div class=task><b>🔴 ${esc(t.title)}</b><button class=secondary onclick="finishTask('${t.id}')">✓</button></div>`).join('')||'<div class=muted>Aucun</div>'}</div><div class=actions><button class=secondary onclick="reminder('${c.id}')">＋ Rappel</button><button class=secondary onclick="newEvent('Rendez-vous — ${esc(c.first)} ${esc(c.last)}')">📅 Rendez-vous</button><button class=primary onclick="contactSale('${c.id}')">💰 Créer une vente</button><button class=danger onclick="delContact('${c.id}')">Supprimer</button></div></div></div>`)}
function calendar(){let y=cal.getFullYear(),m=cal.getMonth(),days=new Date(y,m+1,0).getDate(),start=(new Date(y,m,1).getDay()+6)%7,c='';for(let i=0;i<start;i++)c+='<div></div>';for(let d=1;d<=days;d++){let date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,e=db.events.filter(x=>x.date===date),t=db.tasks.filter(x=>!x.done&&x.due===date);c+=`<div class=cell><b>${d}</b>${e.length?`<div>📅 ${e.length}</div>`:''}${t.length?`<div>🔴 ${t.length}</div>`:''}</div>`}return header()+`<main><div class=title><h1>Calendrier</h1></div><div class=actions><button class=secondary onclick="cal.setMonth(cal.getMonth()-1);render()">‹</button><b style="padding:10px">${cal.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</b><button class=secondary onclick="cal.setMonth(cal.getMonth()+1);render()">›</button></div><div class=cal style="margin-top:12px">${['L','M','M','J','V','S','D'].map(x=>`<b style=text-align:center>${x}</b>`).join('')}${c}</div><div class=section>Événements à venir</div>${db.events.filter(e=>e.date>=today()).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).slice(0,15).map(e=>`<div class=event>📅 <b>${fmt(e.date)} ${e.start||''} — ${esc(e.title)}</b></div>`).join('')||'<div class=muted>Aucun.</div>'}</main>`}
function render(){let c=screen==='home'?home():screen==='contacts'?contacts():screen==='calendar'?calendar():listScreen(screen);document.getElementById('app').innerHTML=c;bind()}
function bind(){}
function finishTask(i){let t=db.tasks.find(x=>x.id===i);if(t)t.done=true;save();render()}
function showAllTasks(){let ts=db.tasks.filter(t=>!t.done);openModal(`<div class=modalbg onclick=close()><div class=modal onclick="event.stopPropagation()"><h2>Toutes les tâches</h2>${ts.map(t=>`<div class=task style="display:flex;justify-content:space-between"><b>🔴 ${esc(t.title)}</b><button class=secondary onclick="finishTask('${t.id}');close()">✓</button></div>`).join('')||'<div class=muted>Aucune.</div>'}</div></div>`)}
function form(title,fields,cb){openModal(`<div class=modalbg onclick=close()><div class=modal onclick="event.stopPropagation()"><h2>${title}</h2><form id=f>${fields}<div class=actions style="justify-content:flex-end"><button type=button class=secondary onclick=close()>Annuler</button></div></form></div></div>`);document.getElementById('f').onsubmit=e=>{e.preventDefault();cb(Object.fromEntries(new FormData(e.target).entries()));close();render()}}
function F(l,n,t='text',v=''){return `<div class=field><label>${l}</label><input name=${n} type=${t} value="${esc(v)}"></div>`}
function newArrival(){form('Nouvel arrivage',F('Modèle *','model')+F('Immatriculation','immat')+F('Finition','finish')+F('Kilométrage','km','number')+F('Couleur','color')+'<div class=tw>'+F("Prix d'achat",'buyPrice','number')+F('Prix bleu','bluePrice','number')+'</div>'+F('Prix noir','blackPrice','number')+F("Date d'achat",'buyDate','date',today())+F('N° VO','vo')+'<button class=primary>Créer</button>',x=>{db.vehicles.push({...x,id:id(),status:'arrivage',delivered:false,prep:false,caro:false,pvo:false,affiche:true,cache:true,garantie:true,problems:[]});save()})}
function newParc(){form('Nouveau véhicule',F('Modèle *','model')+F('Immatriculation','immat')+F('N° VO','vo')+F('Prix bleu','bluePrice','number')+F('Prix noir','blackPrice','number')+'<button class=primary>Créer</button>',x=>{db.vehicles.push({...x,id:id(),status:'parc',affiche:true,cache:true,garantie:true,problems:[]});save()})}
function newTask(){form('Nouvelle tâche',F('Titre *','title')+F('Échéance','due','date')+'<div class=field><label>Importance</label><select name=priority><option>Normale</option><option>Haute</option><option>Basse</option></select></div><button class=primary>Créer</button>',x=>task(x.title,x))}
function newContact(){let opts=['Leboncoin','La centrale','Lead','Mail','Telephone','showroom','autre'].map(x=>`<option>${x}</option>`).join('');form('Nouveau contact',F('Prénom *','first')+F('Nom *','last')+`<div class=field><label>Origine(s)</label><select name=source multiple size=7>${opts}</select></div>`+F('Note','note')+`<div class=field><label>Véhicule d'intérêt</label><select name=vehicleId><option value="">Aucun</option>${V().map(v=>`<option value=${v.id}>${esc(v.model)} ${v.vo?'· VO '+v.vo:''}</option>`).join('')}</select></div><button class=primary>Créer</button>`,x=>{db.contacts.push({id:id(),first:x.first,last:x.last,source:[x.source].filter(Boolean),note:x.note,vehicleIds:x.vehicleId?[x.vehicleId]:[]});save()})}
function newSale(){let opts=V().map(v=>`<option value="${v.id}">${esc(v.model)} ${v.vo?'· VO '+esc(v.vo):''}</option>`).join('');let fields=F('Client (facultatif)','clientName')+`<div class=field><label>Véhicule *</label><select name="vehicleId">${opts}</select></div>`+F('Date de livraison','deliveryDate','date')+`<div class=tw>${F('Heure début','start','time')}${F('Heure fin','end','time')}</div><div class=field><label>Options</label><label class=check><input type=checkbox name="reprise"> Reprise</label><label class=check><input type=checkbox name="finance"> Financement</label><label class=check><input type=checkbox name="service"> Contrat d'entretien</label></div><button class=primary>Créer</button>`;form('Nouvelle vente',fields,x=>{let v=db.vehicles.find(v=>v.id===x.vehicleId);if(!v){alert('Sélectionnez un véhicule.');return}let s={id:id(),clientName:x.clientName,vehicleId:v.id,vehicleName:v.model,vo:v.vo,deliveryDate:x.deliveryDate,start:x.start,end:x.end,reprise:'reprise'in x,finance:'finance'in x,service:'service'in x,status:'active',checks:{dossier:{bdcBacs:false,bdcDbs:false,documents:false,forfait:false,date:!!x.deliveryDate,or:false,gstat:false,tableau:false}}};if(s.reprise)s.checks.reprise={alcopa:false,signed:false,cg:false,histovec:false};if(s.finance)s.checks.finance={signed:false,docs:false};if(s.service)s.checks.service={signed:false};db.sales.push(s);if(x.deliveryDate)createDelivery(s);save()})}
function createDelivery(s){if(db.deliveries.some(d=>d.saleId===s.id))return;let d={id:id(),saleId:s.id,clientName:s.clientName,vehicleName:s.vehicleName,vo:s.vo,date:s.deliveryDate,start:s.start,end:s.end,status:'active',fuel:false,gravage:false,others:[],pre:{revision:false,bsh:false,ct:false,pts160:false,battery:false,prepEst:false}};db.deliveries.push(d);db.events.push({id:id(),title:'Livraison — '+(s.clientName||s.vehicleName),date:s.deliveryDate,start:s.start,end:s.end});save();linked('delivery_fuel',d.id,'Carburant — '+d.vehicleName);linked('delivery_gravage',d.id,'Gravage — '+d.vehicleName)}
function newEvent(title='Rendez-vous'){form('Nouvel événement',F('Titre','title', 'text',title)+F('Date','date','date',today())+F('Heure début','start','time')+F('Heure fin','end','time')+F('Note','note')+'<button class=primary>Créer</button>',x=>{db.events.push({...x,id:id()});save()})}
function reminder(idc){form('Nouveau rappel',F('Titre','title','text','Rappeler')+F('Échéance','due','date')+'<div class=field><label>Importance</label><select name=priority><option>Normale</option><option>Haute</option><option>Basse</option></select></div><button class=primary>Créer</button>',x=>task(x.title,{...x,type:'contact',ref:idc}))}
function contactSale(idc){let c=db.contacts.find(x=>x.id===idc);newSale()}
function finishArrival(idv){let v=db.vehicles.find(v=>v.id===idv);if([!v.delivered,!v.prep,!v.caro,v.pvo].some(Boolean)){alert('Il reste des éléments à valider.');return}v.status='parc';save();close();render();toast('Véhicule transféré dans Parc')}
function cancelArrival(idv){if(confirm('Êtes-vous sûr de vouloir annuler cet arrivage ?')){db.vehicles=db.vehicles.filter(v=>v.id!==idv);save();close();render()}}
function vcheck(i,k,val){let v=db.vehicles.find(v=>v.id===i);v[k]=val;if(v.status==='parc'){let names={affiche:'Affiche manquante',cache:'Cache-plaque manquant',garantie:'Garantie manquante'};if(!val)linked('v_'+k,v.id,names[k]);else done('v_'+k,v.id)}else if(k==='pvo'){if(!val)linked('pvo',v.id,'Faire PVO — '+v.model);else done('pvo',v.id)}save();close();render();vehicle(i)}
function report(i){let t=prompt('Titre du problème');if(!t)return;let v=db.vehicles.find(v=>v.id===i);let p={id:id(),title:t,done:false};v.problems.push(p);linked('problem',p.id,t);save();close();render();vehicle(i)}
function problem(vid,pid,val){let x=db.vehicles.find(v=>v.id===vid),q=x?.problems.find(p=>p.id===pid);if(!q)return;q.done=val;save();if(val)done('problem',pid);else linked('problem',pid,q.title);close();render();vehicle(vid)}
function sell(i){close();newSale()}
function salecheck(idv,g,k,val){let s=db.sales.find(s=>s.id===idv),map={'Dossier':'dossier','Reprise':'reprise','Financement':'finance',"Contrat d'entretien":'service'};s.checks[map[g]][k]=val;save();close();sale(idv)}
function saleEvent(idv){let s=db.sales.find(s=>s.id===idv);newEvent('Livraison — '+(s.clientName||s.vehicleName))}
function openDelivery(sid){let d=db.deliveries.find(d=>d.saleId===sid);if(!d){let s=db.sales.find(s=>s.id===sid);createDelivery(s);d=db.deliveries.find(d=>d.saleId===sid)}close();delivery(d.id)}
function dcheck(idv,k,val){let d=db.deliveries.find(d=>d.id===idv);d[k]=val;if(val)done('delivery_'+k,d.id);else linked('delivery_'+k,d.id,(k==='fuel'?'Carburant':'Gravage')+' — '+d.vehicleName);save();close();render();delivery(idv)}
function pre(idv,k,val){let d=db.deliveries.find(d=>d.id===idv);d.pre[k]=val;save();close();render();delivery(idv)}
function other(idv){let t=prompt('Décris la tâche');if(!t)return;let d=db.deliveries.find(d=>d.id===idv),o={id:id(),title:t,done:false};d.others.push(o);linked('other',o.id,t);save();close();render();delivery(idv)}
function othercheck(idv,oid,val){let d=db.deliveries.find(d=>d.id===idv),o=d.others.find(o=>o.id===oid);o.done=val;val?done('other',oid):linked('other',oid,o.title);save();close();render();delivery(idv)}
function finishDelivery(idv){let d=db.deliveries.find(d=>d.id===idv);if(missingDel(d)){alert('Il reste des éléments à faire.');return}if(!confirm('Terminer la livraison ?'))return;d.status='done';let s=db.sales.find(s=>s.id===d.saleId);if(s)s.status='done';let v=db.vehicles.find(v=>v.id===s?.vehicleId);if(v)v.status='sold';save();close();render();toast('Livraison terminée')}
function contact(i){let c=db.contacts.find(x=>x.id===i);if(!c)return;let vs=(c.vehicleIds||[]).map(id=>db.vehicles.find(v=>v.id===id)).filter(Boolean);let ts=db.tasks.filter(t=>!t.done&&t.type==='contact'&&t.ref===i);openModal(`<div class=modalbg onclick=close()><div class=modal onclick=event.stopPropagation()><h2>👤 ${esc(c.first)} ${esc(c.last)}</h2><div class=box><div><b>Origine</b><div class=muted>${esc((c.source||[]).join(', '))||'—'}</div></div><div style=margin-top:10px><b>Note</b><div class=muted>${esc(c.note)||'—'}</div></div></div><div class=box><h3>Véhicule d'intérêt</h3>${vs.length?vs.map(v=>`<div class=row><div><b>🚘 ${esc(v.model)}</b><div class=muted>${v.vo?'VO '+esc(v.vo):''} ${v.immat?'· '+esc(v.immat):''}</div></div></div>`).join(''):'<div class=muted>Aucun véhicule rattaché.</div>'}</div><div class=box><h3>Rappels</h3>${ts.length?ts.map(t=>`<div class=task><b>🔴 ${esc(t.title)}</b><div class=muted>${t.due?'Échéance '+fmt(t.due):'Sans échéance'} · ${t.priority}</div></div>`).join(''):'<div class=muted>Aucun rappel.</div>'}</div><div class=actions><button class=primary onclick="reminder('${c.id}')">＋ Rappel</button><button class=secondary onclick="contactSale('${c.id}')">💰 Créer une vente</button><button class=secondary onclick="newEvent('Rendez-vous — ${esc(c.first)} ${esc(c.last)}')">📅 Rendez-vous</button><button class=danger onclick="delContact('${c.id}')">Supprimer</button></div></div></div>`)}
function delContact(i){if(confirm('Êtes-vous sûr de vouloir supprimer ce contact ?')){db.contacts=db.contacts.filter(c=>c.id!==i);save();close();render()}}
render();
function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1600)}
</script></body></html>
