<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>VO PILOT</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#111827;--muted:#64748b;--line:#dbe1e8;--blue:#1683f7;--dark:#111827;--green:#166534;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;padding:0 22px 50px}
header{height:92px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin:0 -22px 28px}
.brand{font-size:30px;font-weight:800}.date{font-size:18px;color:var(--muted);margin-bottom:22px}
h1{font-size:34px;margin:0 0 22px}.section{font-size:17px;font-weight:800;color:#64748b;text-transform:uppercase;margin:28px 0 12px}
.task-list{display:flex;flex-direction:column;gap:10px}.task{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px #0f172a0f}
.task-main{flex:1;min-width:0}.task-title{font-weight:700}.task-meta{font-size:13px;color:var(--muted);margin-top:5px}
.priority{font-size:11px;font-weight:800;text-transform:uppercase;padding:3px 7px;border-radius:99px;margin-left:7px}.high{background:#fee2e2;color:#991b1b}.medium{background:#fef3c7;color:#92400e}.low{background:#dcfce7;color:#166534}
.actions{display:flex;gap:7px}.icon{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:10px}.ok{color:var(--green)}.del{color:var(--red)}
.add{width:100%;border:0;background:var(--dark);color:#fff;border-radius:16px;padding:17px;font-weight:800;font-size:17px;margin-top:12px}
.empty{color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:15px;padding:17px;text-align:center}
.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}.module{background:#fff;border:1px solid var(--line);border-radius:20px;padding:25px;min-height:150px;text-align:left;box-shadow:0 2px 8px #0f172a0f}.module-head{display:flex;align-items:center;gap:12px;font-size:21px;color:var(--blue)}.module-icon{font-size:28px}.count{font-size:48px;font-weight:800;color:var(--blue);margin-top:18px}
.page-head{display:flex;align-items:center;gap:12px;margin:8px 0 24px}.back,.secondary{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px}.page-head h1{margin:0;font-size:31px}.page-add{margin-left:auto}.primary{background:var(--dark);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.vehicle{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 2px 8px #0f172a0f}.vtop{display:flex;justify-content:space-between;gap:10px}.vtitle{font-size:19px;font-weight:800}.sub{font-size:13px;color:var(--muted);margin-top:4px}.status{white-space:nowrap;font-size:12px;font-weight:800;padding:6px 9px;border-radius:99px}.pending{background:#fff7ed;color:#9a3412}.arrived{background:#dcfce7;color:#166534}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:16px;padding-top:14px;border-top:1px solid #edf0f3}.ilabel{font-size:11px;text-transform:uppercase;color:#94a3b8;font-weight:700}.ivalue{font-size:14px;margin-top:2px}.card-actions{display:flex;gap:8px;margin-top:16px}.card-actions button{flex:1}.danger{color:var(--red);border-color:#fecaca}
.checks{margin-top:18px;border-top:1px solid #edf0f3;padding-top:14px}.checks-title{font-weight:800;margin-bottom:8px}.check{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:14px}.check input{width:18px;height:18px;accent-color:var(--blue)}.missing{color:#9a3412}.done{color:#166534}
.overlay{position:fixed;inset:0;background:#0f172a7d;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.overlay.open{display:flex}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:25px;box-shadow:0 20px 60px #0004}.mhead{display:flex;align-items:center;gap:12px;margin-bottom:22px}.mhead h2{margin:0;flex:1;font-size:25px}.close{border:0;background:transparent;color:#64748b;font-size:30px;width:40px;height:40px}.form{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px}.full{grid-column:1/-1}label{font-size:13px;font-weight:800}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:11px;padding:12px 13px;outline:0;background:#fff}textarea{min-height:90px;resize:vertical}.mActions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.arrivedBox{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:11px;background:#f8fafc}.arrivedBox input{width:18px}
.history{opacity:.7}
@media(max-width:760px){.app{padding:0 14px 40px}header{margin:0 -14px 24px;height:76px}.modules,.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.page-head{flex-wrap:wrap}.page-add{width:100%;margin-left:0}.page-add button{width:100%}}
</style>
</head>
<body><div id="app"></div><div id="overlay" class="overlay"><div id="modal" class="modal"></div></div>
<script>
const KEY="vo_pilot_data_v4";
const CHECKS=[
 ["priceDisplay","Affiche de prix"],["warranty","Garantie"],["plateCover","Cache plaque"],
 ["cleaning","Nettoyage"],["photos","Photos"],["adPublished","Annonce publiée"],
 ["location","Emplacement"],["fuel","Carburant / recharge"],["other","Autre"]
];
function empty(){return{vehicles:[],tasks:[]}}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||"null");return x||empty()}catch(e){return empty()}}
let db=load();db.vehicles??=[];db.tasks??=[];
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function id(p){return p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7)}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function today(){return new Date().toISOString().slice(0,10)}
function fmt(x){if(!x)return"—";let d=new Date(x+"T00:00:00");return isNaN(d)?"—":d.toLocaleDateString("fr-FR")}
function vname(v){return [v.model,v.immat].filter(Boolean).join(" — ")||"Véhicule sans nom"}
function open(){document.getElementById("overlay").classList.add("open")}
function close(){document.getElementById("overlay").classList.remove("open")}
document.getElementById("overlay").onclick=e=>{if(e.target.id==="overlay")close()};document.onkeydown=e=>{if(e.key==="Escape")close()}
function head(){return'<header><div class="brand">VO PILOT</div></header>'}
function module(i,n,c,r){return`<button class="module" onclick="go('${r}')"><div class="module-head"><span class="module-icon">${i}</span><span>${n}</span></div><div class="count">${c}</div></button>`}
function priorityRank(p){return p==="high"?0:p==="medium"?1:2}
function openTasks(){return db.tasks.filter(t=>!t.done&&!t.deleted).sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999")||priorityRank(a.priority)-priorityRank(b.priority))}
function taskCard(t){let p={low:"Faible",medium:"Moyenne",high:"Élevée"}[t.priority]||"Moyenne";return`<div class="task"><div class="task-main"><div class="task-title">${esc(t.title)} <span class="priority ${t.priority}">${p}</span></div><div class="task-meta">${t.due?"Échéance : "+fmt(t.due):"Sans échéance"}${t.auto?" · Tâche automatique":""}</div></div><div class="actions"><button class="icon ok" title="Terminer" onclick="finishTask('${t.id}')">✓</button><button class="icon del" title="Supprimer" onclick="deleteTask('${t.id}')">🗑</button></div></div>`}
function home(){let ts=openTasks();document.getElementById("app").innerHTML=head()+`<main><div class="date">${new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div><h1>À faire</h1>${ts.length?`<div class="task-list">${ts.slice(0,5).map(taskCard).join("")}</div>`:`<div class="empty">Aucune tâche en attente 🎉</div>`}${ts.length>5?'<button class="secondary" style="width:100%;margin-top:10px" onclick="go(\'tasks\')">▼ Afficher toutes les tâches</button>':""}<button class="add" onclick="taskModal()">＋ Ajouter une tâche</button><div class="modules">${module("🚚","Arrivages",db.vehicles.filter(v=>v.area==="arrival").length,"arrivals")}${module("🚗","Parc",db.vehicles.filter(v=>v.area==="park").length,"park")}${module("📋","Tâches",openTasks().length,"tasks")}</div></main>`}
function page(title,icon,btn,fn){return`<div class="page-head"><button class="back" onclick="home()">← Retour</button><h1>${icon} ${title}</h1><div class="page-add"><button class="primary" onclick="${fn}">＋ ${btn}</button></div></div>`}
function info(l,v){return`<div><div class="ilabel">${l}</div><div class="ivalue">${esc(v||"—")}</div></div>`}
function arrivalCard(v){return`<div class="vehicle"><div class="vtop"><div><div class="vtitle">${esc(vname(v))}</div><div class="sub">${esc(v.finish||"Finition non renseignée")}</div></div><span class="status ${v.arrived?"arrived":"pending"}">${v.arrived?"Arrivée":"À recevoir"}</span></div><div class="info">${info("Kilométrage",v.km)}${info("Couleur",v.color)}${info("Prix d'achat",v.buyPrice)}${info("Date d'achat",fmt(v.buyDate))}${info("Prix bleu",v.bluePrice)}${info("Prix noir",v.blackPrice)}</div>${v.comment?`<div class="sub" style="margin-top:13px">💬 ${esc(v.comment)}</div>`:""}<div class="card-actions"><button class="secondary" onclick="vehicleModal('arrival','${v.id}')">Modifier</button><button class="secondary" onclick="movePark('${v.id}')">🚗 Parc</button><button class="secondary danger" onclick="delVehicle('${v.id}')">🗑</button></div></div>`}
function arrivals(){let l=db.vehicles.filter(v=>v.area==="arrival");document.getElementById("app").innerHTML=head()+`<main>${page("Arrivages","🚚","Nouvel arrivage","vehicleModal('arrival')")}${l.length?`<div class="grid">${l.map(arrivalCard).join("")}</div>`:'<div class="empty">Aucun véhicule en arrivage.</div>'}</main>`}
function checkRow(v,k,label){let c=!!(v.checks||{})[k];return`<label class="check ${c?"done":"missing"}"><input type="checkbox" ${c?"checked":""} onchange="toggleCheck('${v.id}','${k}',this.checked)"><span>${label}</span></label>`}
function parkCard(v){return`<div class="vehicle"><div class="vtop"><div><div class="vtitle">${esc(vname(v))}</div><div class="sub">${esc(v.finish||"Finition non renseignée")}</div></div></div><div class="info">${info("Kilométrage",v.km)}${info("Couleur",v.color)}${info("Prix d'achat",v.buyPrice)}${info("Date d'achat",fmt(v.buyDate))}${info("Prix bleu",v.bluePrice)}${info("Prix noir",v.blackPrice)}</div>${v.comment?`<div class="sub" style="margin-top:13px">💬 ${esc(v.comment)}</div>`:""}<div class="checks"><div class="checks-title">Préparation du véhicule</div>${CHECKS.map(x=>checkRow(v,x[0],x[1])).join("")}<div class="sub">Les éléments non cochés génèrent automatiquement une tâche.</div></div><div class="card-actions"><button class="secondary" onclick="vehicleModal('park','${v.id}')">✏️ Modifier</button><button class="secondary danger" onclick="delVehicle('${v.id}')">🗑 Supprimer</button></div></div>`}
function park(){let l=db.vehicles.filter(v=>v.area==="park");document.getElementById("app").innerHTML=head()+`<main>${page("Parc","🚗","Nouvelle fiche","vehicleModal('park')")}${l.length?`<div class="grid">${l.map(parkCard).join("")}</div>`:'<div class="empty">Aucun véhicule dans le Parc.</div>'}</main>`}
function field(l,n,v,t="text",req=false){return`<div class="field"><label>${l}</label><input name="${n}" type="${t}" value="${esc(v||"")}" ${req?"required":""}></div>`}
function vehicleModal(area,vid=""){let v=vid?db.vehicles.find(x=>x.id===vid):null;let arrival=area==="arrival";document.getElementById("modal").innerHTML=`<div class="mhead"><h2>${arrival?"🚚":"🚗"} ${v?(arrival?"Modifier l'arrivage":"Modifier le véhicule"):(arrival?"Nouvel arrivage":"Nouvelle fiche Parc")}</h2><button class="close" onclick="close()">×</button></div><form onsubmit="saveVehicle(event,'${area}','${vid}')"><div class="form">${field("Modèle *","model",v?.model,"text",true)}${field("Immatriculation","immat",v?.immat)}${field("Finition","finish",v?.finish)}${field("Kilométrage","km",v?.km,"number")}${field("Couleur","color",v?.color)}${field("Prix d'achat","buyPrice",v?.buyPrice,"number")}${field("Prix bleu","bluePrice",v?.bluePrice,"number")}${field("Prix noir","blackPrice",v?.blackPrice,"number")}${field("Date d'achat","buyDate",v?.buyDate,"date")}${arrival?`<div class="field full"><label>Statut d'arrivée</label><div class="arrivedBox"><input id="arrived" type="checkbox" ${v?.arrived?"checked":""}><span>Le véhicule est arrivé</span></div></div>`:""}<div class="field full"><label>Commentaire</label><textarea name="comment">${esc(v?.comment)}</textarea></div></div><div class="mActions"><button type="button" class="secondary" onclick="close()">Annuler</button><button class="primary">Enregistrer</button></div></form>`;open()}
function saveVehicle(e,area,vid){e.preventDefault();let f=new FormData(e.target),v=vid?db.vehicles.find(x=>x.id===vid):{id:id("veh"),area,checks:{}};v.area=area;["model","immat","finish","km","color","buyPrice","bluePrice","blackPrice","buyDate","comment"].forEach(k=>v[k]=(f.get(k)||"").toString().trim());if(area==="arrival")v.arrived=document.getElementById("arrived").checked;if(!vid)db.vehicles.push(v);save();close();go(area==="arrival"?"arrivals":"park")}
function movePark(vid){let v=db.vehicles.find(x=>x.id===vid);if(!v)return;v.area="park";v.checks=v.checks||{};CHECKS.forEach(x=>{if(typeof v.checks[x[0]]!=="boolean")v.checks[x[0]]=false});save();park()}
function delVehicle(vid){let v=db.vehicles.find(x=>x.id===vid);if(!v)return;if(confirm("Supprimer "+vname(v)+" ?")){db.vehicles=db.vehicles.filter(x=>x.id!==vid);db.tasks=db.tasks.filter(t=>t.vehicleId!==vid);save();go(v.area==="arrival"?"arrivals":"park")}}
function toggleCheck(vid,key,checked){let v=db.vehicles.find(x=>x.id===vid);if(!v)return;v.checks=v.checks||{};v.checks[key]=checked;let existing=db.tasks.find(t=>t.auto&&t.vehicleId===vid&&t.checkKey===key&&!t.deleted);let label=CHECKS.find(x=>x[0]===key)?.[1]||key;if(!checked){if(existing){existing.done=false;existing.deleted=false;existing.due=existing.due||today()}else db.tasks.push({id:id("task"),title:label+" — "+vname(v),due:today(),priority:"medium",done:false,deleted:false,auto:true,vehicleId:vid,checkKey:key})}else if(existing){existing.done=true;existing.completedAt=new Date().toISOString()}save();park()}
function taskModal(){document.getElementById("modal").innerHTML=`<div class="mhead"><h2>☑️ Nouvelle tâche</h2><button class="close" onclick="close()">×</button></div><form onsubmit="saveTask(event)"><div class="form">${field("Titre *","title","","text",true)}${field("Échéance","due","","date")}<div class="field"><label>Importance</label><select name="priority"><option value="low">Faible</option><option value="medium" selected>Moyenne</option><option value="high">Élevée</option></select></div></div><div class="mActions"><button type="button" class="secondary" onclick="close()">Annuler</button><button class="primary">Enregistrer</button></div></form>`;open()}
function saveTask(e){e.preventDefault();let f=new FormData(e.target);db.tasks.push({id:id("task"),title:(f.get("title")||"").trim(),due:f.get("due")||"",priority:f.get("priority")||"medium",done:false,deleted:false,auto:false});save();close();tasks()}
function finishTask(tid){let t=db.tasks.find(x=>x.id===tid);if(!t)return;t.done=true;t.completedAt=new Date().toISOString();if(t.auto&&t.vehicleId&&t.checkKey){let v=db.vehicles.find(x=>x.id===t.vehicleId);if(v){v.checks=v.checks||{};v.checks[t.checkKey]=true}}save();renderCurrent()}
function deleteTask(tid){let t=db.tasks.find(x=>x.id===tid);if(!t)return;t.deleted=true;if(t.auto&&t.vehicleId&&t.checkKey){let v=db.vehicles.find(x=>x.id===t.vehicleId);if(v){v.checks=v.checks||{};v.checks[t.checkKey]=true}}save();renderCurrent()}
function tasks(){let o=openTasks(),h=db.tasks.filter(t=>t.done&&!t.deleted).sort((a,b)=>(b.completedAt||"").localeCompare(a.completedAt||""));document.getElementById("app").innerHTML=head()+`<main>${page("Tâches","📋","Ajouter une tâche","taskModal")}<div class="section">À faire</div>${o.length?`<div class="task-list">${o.map(taskCard).join("")}</div>`:'<div class="empty">Aucune tâche en attente 🎉</div>'}<div class="section">Historique</div>${h.length?`<div class="task-list history">${h.map(t=>`<div class="task"><div class="task-main"><div class="task-title">✓ ${esc(t.title)}</div><div class="task-meta">Terminée le ${t.completedAt?new Date(t.completedAt).toLocaleDateString("fr-FR"):"—"}</div></div><button class="icon del" onclick="deleteTask('${t.id}')">🗑</button></div>`).join("")}`:'<div class="empty">Aucune tâche terminée.</div>'}</main>`}
let current="home";function go(r){current=r;if(r==="arrivals")arrivals();else if(r==="park")park();else if(r==="tasks")tasks();else home()}function renderCurrent(){go(current)}
home();
</script></body></html>
